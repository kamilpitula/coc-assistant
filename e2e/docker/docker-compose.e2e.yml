services:
  mock-oauth2:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    container_name: coc-mock-oauth2
    ports:
      - "8443:8443"
    environment:
      SERVER_PORT: "8443"
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: /certs/dev-cert.pfx
      SERVER_SSL_KEY_STORE_PASSWORD: "${COC_E2E_CERT_PASSWORD}"
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
      JSON_CONFIG_PATH: /config/mock-oauth2-config.json
    volumes:
      - ../.certs/dev-cert.pfx:/certs/dev-cert.pfx:ro
      - ./mock-oauth2-config.json:/config/mock-oauth2-config.json:ro
