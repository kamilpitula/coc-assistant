<style>
/* Layout: prototype toolbar on top, then a fake browser frame holding the app (shadcn-neutral look of the real app). */

}

  --primary: #ededed; --primary-fg: #111; --live: #4ade80; --live-bg: #12301d; --destructive: #f87171;
  --chrome: #1a1828; --chrome-fg: #dcd8f5; --proto: #a99cff; --proto-bg: #241f45; --overlay: rgba(0,0,0,.6); --focus: #60a5fa;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b0b0c; --fg: #ededed; --muted: #a1a1aa; --muted-bg: #1c1c1f; --border: #2c2c31;
  --primary: #ededed; --primary-fg: #111; --live: #4ade80; --live-bg: #12301d; --destructive: #f87171;
  --chrome: #1a1828; --chrome-fg: #dcd8f5; --proto: #a99cff; --proto-bg: #241f45; --overlay: rgba(0,0,0,.6); --focus: #60a5fa;
  color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.45;

.proto { background: var(--chrome); color: var(--chrome-fg); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; max-width: 1280px; margin: 0 auto }

/* App components */

.link { background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-weight: 600 }
.backlink { display: inline-flex; gap: 6px; align-items: center; background: none; border: 0; padding: 0; cursor: pointer; color: var(--muted); font-size: 13px }
.backlink:hover { color: var(--fg) }

.small { font-size: 12.5px }

.chip.outline { background: transparent }

.campaign-head { padding-top: 18px; display: flex; flex-direction: column; gap: 4px }

.tabs button { background: none; border: 0; padding: 8px 10px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap }
.tabs button[aria-current="page"] { color: var(--fg); border-bottom-color: var(--fg); font-weight: 700 }

/* Scene header */
.scene-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start }

.subtabs button[aria-current="page"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08) }
.count { font-size: 11px; font-variant-numeric: tabular-nums; background: var(--border); color: var(--fg); border-radius: 999px; padding: 0 7px; font-weight: 700 }

.run { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start }
@media (max-width: 1024px) { .run { grid-template-columns: minmax(0,1fr) } }
.region { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.region > header { display: flex; justify-content: space-between; align-items: center; gap: 8px }
.region h2 { font-size: 15px }
.region.placeholder { border-style: dashed; color: var(--muted); background: transparent }
.notes-body p { margin: 0 0 8px; max-width: 65ch }
.people { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column }
.people li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid var(--border) }
.people li:first-child { border-top: 0 }
.matnav { display: flex; flex-direction: column; gap: 0 }

.matnav button:first-child { border-top: 0 }
.matnav button:hover { background: var(--muted-bg) }

/* Material entry (shared between Scene page and Active Scene) */
.group { display: flex; flex-direction: column; gap: 8px }
.group-head { display: flex; flex-direction: column; gap: 2px }

.entry { display: flex; gap: 12px; justify-content: space-between; align-items: center; padding: 10px 14px; border-top: 1px solid var(--border); flex-wrap: wrap }
.entry:first-child { border-top: 0 }
.entry .info { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 260px }
.entry .title { background: none; border: 0; padding: 0; cursor: pointer; font-weight: 700; text-align: left; font-size: 14px }
.entry .title:hover { text-decoration: underline; text-underline-offset: 3px }
.entry .badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.entry .actions { display: flex; gap: 6px; flex-wrap: wrap }
.partial { font-size: 12.5px; color: var(--muted) }
.partial b { color: var(--fg); font-weight: 600 }
.empty { padding: 14px; color: var(--muted); font-size: 13px }
.subhead { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 8px 14px; background: var(--muted-bg); border-top: 1px solid var(--border) }
.subhead:first-child { border-top: 0 }
details.sect { border: 1px solid var(--border); border-radius: 10px }
details.sect > summary { cursor: pointer; padding: 12px 14px; font-weight: 700; font-size: 16px; display: flex; gap: 8px; align-items: center; list-style: none }
details.sect > summary::-webkit-details-marker { display: none }
details.sect > summary::before { content: "\25B8"; transition: transform .15s }
details.sect[open] > summary::before { transform: rotate(90deg) }
details.sect > .entries { border: 0; border-top: 1px solid var(--border); border-radius: 0 }
details.sect > p { margin: 0 14px 10px; font-size: 12.5px; color: var(--muted) }

/* Side panel (sheet) */
.scrim { position: absolute; inset: 0; background: var(--overlay); z-index: 20 }
.sheet { position: absolute; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--bg); border-left: 1px solid var(--border); z-index: 21; display: flex; flex-direction: column; box-shadow: -8px 0 24px rgba(0,0,0,.12) }
.sheet.wide { width: min(720px, 100%) }
.sheet header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px; align-items: flex-start }
.sheet header h2 { font-size: 17px }
.sheet .body { padding: 14px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; flex: 1 }
.sheet footer { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px; align-items: center }
.x { border: 1px solid var(--border); background: var(--bg); border-radius: 6px; width: 30px; height: 30px; cursor: pointer; flex: none }
.readaloud { border-left: 3px solid var(--border); padding: 8px 12px; background: var(--muted-bg); border-radius: 0 6px 6px 0; font-style: italic }
.img-ph { aspect-ratio: 4/3; max-width: 100%; border-radius: 8px; background: repeating-linear-gradient(45deg, var(--muted-bg) 0 10px, var(--bg) 10px 20px); border: 1px solid var(--border); display: grid; place-items: center; color: var(--muted); font-size: 12px }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; font-variant-numeric: tabular-nums }
.stats div { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; display: flex; justify-content: space-between; font-size: 13px }
.stats b { font-weight: 700 }
.clue { border-top: 1px solid var(--border); padding-top: 10px; display: flex; flex-direction: column; gap: 6px }
.clue:first-child { border-top: 0; padding-top: 0 }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
.wall-compose { display: flex; flex-direction: column; gap: 6px }
.wall-compose textarea { width: 100%; resize: vertical; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px }
.wall-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column }
.wall-entry { border-top: 1px solid var(--border); padding: 8px 0; display: flex; flex-direction: column; gap: 2px }
.wall-entry p { margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden }

/* Dialog */
.modal { position: absolute; z-index: 31; top: 120px; left: 50%; transform: translateX(-50%); width: min(440px, calc(100% - 32px)); background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.2) }
.modal fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px }
.modal legend { font-weight: 700; margin-bottom: 6px }
.modal label { display: flex; gap: 8px; align-items: center }
.scrim.top { z-index: 30 }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px }
.toast { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--primary); color: var(--primary-fg); padding: 8px 14px; border-radius: 8px; z-index: 40; font-size: 13px }
@media (max-width: 640px) { .app { padding: 0 14px 30px } .topbar { margin: 0 -14px; padding-inline: 14px } .stats { grid-template-columns: repeat(2, minmax(0,1fr)) } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<div class="proto" aria-label="Prototype controls">
  <div class="proto-row">
    <span class="proto-label">Prototype</span>
    <div class="seg" role="group" aria-label="Variant" id="variantSeg">
      <button type="button" data-variant="a">A &middot; Scene sub-tabs</button>
      <button type="button" data-variant="b">B &middot; Material drawer</button>
      <button type="button" data-variant="c">C &middot; Material page</button>
    </div>
    <div class="seg" role="group" aria-label="Signed in as" id="roleSeg">
      <button type="button" data-role="keeper">Keeper</button>
      <button type="button" data-role="player">Player (Harvey)</button>
    </div>
    <button type="button" class="btn sm" id="resetBtn">Reset data</button>
  </div>
  <div class="notes" id="notes"></div>
</div>

<div class="browser">
  <div class="addr">
    <button type="button" id="backBtn" aria-label="Browser back">&larr;</button>
    <div class="url" id="url" aria-label="Address"></div>
  </div>

    <div id="overlay"></div>
  </div>
</div>

<script>
const INVESTIGATORS = { harvey: 'Harvey Walters', lucy: 'Lucy Ward', cy: 'Cy Holloway' };
const MATERIAL = [
  { id: 'h1', type: 'Handout', title: 'The front door', kind: 'Read-aloud', vis: 'PF',
    body: 'The door hangs crooked on rust-brown hinges. Someone has nailed a horseshoe above it, upside down, and the paint around the keyhole is scored with fresh scratches.' },
  { id: 'h2', type: 'Handout', title: 'The secret door', kind: 'Text', vis: 'KF',
    body: 'Behind the study bookcase. A Spot Hidden roll finds the draught from the gap; the latch is the third volume of Gibbon.' },
  { id: 'h3', type: 'Handout', title: 'Corbitt House plan', kind: 'Image', vis: 'PF', img: 'Ground-floor plan of the Corbitt House' },
  { id: 'h4', type: 'Handout', title: 'Arkham map', kind: 'Map', vis: 'KF', img: 'Keeper map of Arkham with the Corbitt House marked' },
  { id: 'h5', type: 'Handout', title: 'Diary pages', kind: 'Document', vis: 'KF', body: 'PDF, 4 pages: Walter Corbitt, 1835-1852.' },
  { id: 'h6', type: 'Handout', title: 'Boston Globe clipping, 1918', kind: 'Text', vis: 'PF',
    body: 'FAMILY FLEES "HAUNTED" HOUSE. The Macario family left the Corbitt House on Tuesday after the father was gravely injured in an unexplained fall.' },
  { id: 'n1', type: 'NPE', title: 'The landlord', entity: 'Mr. Knott', entityType: 'Human NPC',
    body: 'A stooped man in his sixties who keeps the house keys on a ring at his belt and will not step past the porch.',
    stats: { STR: 50, CON: 55, SIZ: 60, DEX: 40, INT: 65, POW: 50, HP: 11, SAN: 48 }, skills: 'Listen 50%, Spot Hidden 40%, Persuade 35%' },
  { id: 'n2', type: 'NPE', title: 'A shape in the cellar', entity: 'Corbitt (revenant)', entityType: 'Mythos Creature', body: null,
    stats: { STR: 90, CON: 75, SIZ: 70, DEX: 40, INT: 70, POW: 90, HP: 14, MP: 18 }, skills: 'Attacks: Flying dagger 50%, 1D4+2. Sanity loss 0/1D6.' },
  { id: 'i1', type: 'Item', title: 'Rusted cellar key', soon: true },
];
const SEED_REVEALS = [
  { id: 'r1', subject: 'h3', to: ['harvey', 'lucy', 'cy'], at: '9:12 PM' },
  { id: 'r2', subject: 'h1', to: ['harvey'], at: '9:05 PM' },
];
const NOTES = {
  a: `<b>A &middot; Scene sub-tabs (selected).</b> v2: Wall region (5 latest + composer) above Investigators present; the Scene material box is removed from Run because the sub-tabs already carry the counts.<br> A second row of tabs inside the Active Scene: <b>Run</b>, <b>To reveal</b>, <b>Keeper reference</b>, <b>Revealed</b>. Each tab has its own URL.
    <ul><li>Try: Reveal "The front door" to Lucy and Cy from <b>To reveal</b> and watch it move to <b>Revealed</b>.</li>
    <li>Try: on <b>Run</b>, open Lucy's Clues (side panel), then "Open full page" and use "Back to The Corbitt House".</li>
    <li>Watch out: two tab rows stacked. The scene header stays visible on every sub-tab.</li></ul>`,
  b: `<b>B &middot; Material drawer.</b> The Run view is the only page. "Material" opens a wide drawer with the three groups; the Keeper never leaves Run.
    <ul><li>Try: open Material, reveal something, close the drawer with the browser back button.</li>
    <li>Content opens inside the drawer (with "Back to material") so only one panel is ever open.</li>
    <li>Watch out: the drawer covers Investigators present while it is open.</li></ul>`,
  c: `<b>C &middot; Material page.</b> Run links to one "Scene material" page with the three groups as collapsible sections and a "Back to The Corbitt House" link.
    <ul><li>Try: open Scene material, collapse sections, reveal, go back.</li>
    <li>Simplest to build; the Active Scene tab stays current on both pages.</li>
    <li>Watch out: a full page change for every reveal trip.</li></ul>`,
  shared: `Shared in every variant: the <b>Active Scene</b> tab with a Live badge, side panels kept in the URL (<span style="font-family:var(--font-mono)">?panel=</span>), "Open full page" with <span style="font-family:var(--font-mono)">?from=active-scene</span>, and the same material entry on the Scene page (Overview &rarr; The Haunting &rarr; The Corbitt House, or "Open in Scenario").`,
  player: `<b>Player view.</b> Content is unchanged. New: the <b>Active Scene</b> tab with a Live badge, the <b>Wall</b> box in the right column (Public entries only, posts are Public), Clues open in the side panel, and the full Clues page links back to the scene.`,
};

const S = {};
function reset() {
  S.variant = (location.hash || '#a').slice(1).replace(/[^abc]/g, '') || 'a';
  S.role = 'keeper';
  S.present = ['harvey', 'lucy', 'cy'];
  S.reveals = SEED_REVEALS.map((r) => ({ ...r, to: [...r.to] }));
  S.history = [];
  S.route = { page: 'active', sub: 'run' };
  S.dialog = null;
  S.status = '';
  S.notesOpen = true;
  S.wall = [
    { at: '9:14 PM', author: 'Keeper', text: 'The front door slams shut behind Harvey. Nobody touched it.', keeperOnly: false },
    { at: '9:10 PM', author: 'Keeper', text: 'Corbitt has noticed Cy. Whispers start next time Cy is alone.', keeperOnly: true },
    { at: '9:06 PM', author: 'Lucy', text: 'Lucy pockets the horseshoe from above the door.', keeperOnly: false },
    { at: '9:02 PM', author: 'Keeper', text: 'The Investigators reach the Corbitt House at dusk. Knott hands over the keys at the gate.', keeperOnly: false },
  ];
}

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const byId = (id) => MATERIAL.find((m) => m.id === id);
const names = (ids) => { const n = ids.map((i) => INVESTIGATORS[i]); return n.length < 2 ? n.join('') : n.slice(0, -1).join(', ') + ' and ' + n[n.length - 1]; };
const recipients = (id) => [...new Set(S.reveals.filter((r) => r.subject === id).flatMap((r) => r.to))];
const revealable = (m) => (m.type === 'Handout' && m.vis === 'PF') || m.type === 'NPE' || m.type === 'Item';
const isDone = (m) => !m.soon && S.present.every((p) => recipients(m.id).includes(p));
function groups() {
  const toReveal = MATERIAL.filter((m) => revealable(m) && !isDone(m));
  const reference = [...MATERIAL.filter((m) => m.type === 'Handout' && m.vis === 'KF'),
    ...MATERIAL.filter((m) => m.type === 'NPE').map((m) => ({ id: 'p-' + m.id, type: 'Profile', npe: m, title: m.entity, entityType: m.entityType }))];
  const revealed = [...S.reveals].reverse();
  return { toReveal, reference, revealed };
}

/* ---------- routing ---------- */
const BASE = '/campaigns/arkham-nights';
function urlOf(r) {
  let path = BASE; const q = [];
  if (r.page === 'overview') path += '';
  if (r.page === 'wall') path += '/wall';
  if (r.page === 'settings') path += '/settings';
  if (r.page === 'active') { path += '/active-scene'; if (S.variant === 'a' && r.sub && r.sub !== 'run' && S.role === 'keeper') path += '/' + r.sub; }
  if (r.page === 'material') path += '/active-scene/material';
  if (r.page === 'scene-prep') path += '/scenarios/the-haunting/scenes/corbitt-house';
  if (r.page === 'clues') path += S.role === 'player' ? '/investigator/clues' : '/investigators/' + r.id + '/clues';
  if (r.page === 'content') path += '/scenarios/the-haunting/scenes/corbitt-house/handouts/' + r.id;
  if (r.page === 'profile') path += '/' + (byId(r.id).entityType === 'Human NPC' ? 'human-npcs' : 'mythos-creatures') + '/' + r.id;
  if (r.drawer) { q.push('material=' + r.drawer); if (r.drawerItem) q.push('item=' + r.drawerItem); }
  if (r.panel) { q.push('panel=' + r.panel.type); q.push((r.panel.type === 'clues' ? 'investigator=' : 'id=') + r.panel.id); }
  if (r.from) q.push('from=' + r.from);
  return esc(path) + (q.length ? '<span class="q">?' + esc(q.join('&')) + '</span>' : '');
}
function go(r, opts = {}) { if (!opts.replace) S.history.push(S.route); S.route = r; if (!opts.keepStatus) S.status = ''; render(); }
function back() { if (S.history.length) { S.route = S.history.pop(); S.status = ''; render(); } }
function closePanel() {
  const prev = S.history[S.history.length - 1];
  const without = { ...S.route, panel: undefined };

}

function entriesList(list, ctx, emptyText) {

    <fieldset><legend>Reveal to</legend>${S.present.map((id) => `<label><input type="checkbox" id="cb-${id}" data-cb="${id}" ${dlg.checked.includes(id) ? 'checked' : ''}> ${INVESTIGATORS[id]}${rec.includes(id) ? ' <span class="muted small">(already revealed)</span>' : ''}</label>`).join('')}</fieldset>
    ${dlg.error ? `<p style="margin:0;color:var(--destructive)" class="small">Choose at least one Investigator.</p>` : ''}
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-dlg="cancel">Cancel</button><button type="button" class="btn primary" data-dlg="ok">Reveal</button></div></div>`;
}

/* ---------- render ---------- */
function render() {
  document.querySelectorAll('#variantSeg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.variant === S.variant)));
  document.querySelectorAll('#roleSeg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.role === S.role)));
  document.getElementById('notes').innerHTML = (S.role === 'player' ? NOTES.player : NOTES[S.variant]) + `<div style="margin-top:6px">${NOTES.shared}</div>`;
  document.getElementById('url').innerHTML = urlOf(S.route);
  document.getElementById('backBtn').disabled = !S.history.length;
  const r = S.route; let page;
  if (r.page === 'active') page = S.role === 'player' ? playerActive() : (S.variant === 'a' ? variantA() : sceneHeader(false) + runView());
  else if (r.page === 'material') page = materialPage();
  else if (r.page === 'overview') page = overviewPage();
  else if (r.page === 'wall') page = wallPage();
  else if (r.page === 'settings') page = '<p class="muted">Campaign settings.</p>';
  else if (r.page === 'scene-prep') page = scenePrepPage();
  else page = fullPage();
  document.getElementById('app').innerHTML = campaignHeader(tabOf(r.page)) + `<div class="page">${S.status ? `<p class="status" role="status">${esc(S.status)}</p>` : ''}${page}</div>`;
  document.getElementById('overlay').innerHTML = drawerHtml() + panelHtml() + dialogHtml();
  const focusTarget = document.querySelector('#overlay .modal input, #overlay .sheet .x');
  if (focusTarget) focusTarget.focus({ preventScroll: true });
}

function toast(text) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
  document.getElementById('viewport').appendChild(t); setTimeout(() => t.remove(), 1600);
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('button, [data-close-panel], [data-close-drawer]'); if (!el) return;
  const d = el.dataset;
  if (d.variant) { S.variant = d.variant; history.replaceState(null, '', '#' + d.variant); S.history = []; S.route = { page: 'active', sub: 'run' }; S.status = ''; S.dialog = null; return render(); }
  if (d.role) { S.role = d.role; S.history = []; S.route = { page: 'active', sub: 'run' }; S.status = ''; S.dialog = null; return render(); }
  if (el.id === 'resetBtn') { const v = S.variant; reset(); S.variant = v; return render(); }
  if (el.id === 'backBtn') return back();
  if (d.noop !== undefined) return toast('Not part of this prototype');
  if (d.go) return go(JSON.parse(d.go));
  if (d.backTo) { const prev = S.history[S.history.length - 1]; return prev && prev.page === 'active' && !prev.panel ? back() : go({ page: 'active', sub: 'run' }); }
  if (d.panel) { const [type, id] = d.panel.split(':'); if (S.route.drawer) return go({ ...S.route, drawerItem: type === 'profile' ? 'p-' + id : id }, { keepStatus: true }); return openPanel(type, id); }
  if (d.closePanel !== undefined) return closePanel();
  if (d.full) { const f = JSON.parse(d.full); return go(f); }
  if (d.drawer) return go({ page: 'active', sub: 'run', drawer: d.drawer }, { keepStatus: true, replace: Boolean(S.route.drawer) });
  if (d.drawerItem !== undefined) return d.drawerItem === '' ? back() : go({ ...S.route, drawerItem: d.drawerItem });
  if (d.closeDrawer !== undefined) { const base = { page: 'active', sub: 'run' }; return go(base); }
  if (d.reveal) { const rec = recipients(d.reveal); S.dialog = { id: d.reveal, trigger: el.id, checked: S.present.filter((p) => !rec.includes(p)) }; return render(); }
  if (d.dlg === 'cancel') { S.dialog = null; return render(); }
  if (d.dlg === 'ok') {
    if (!S.dialog.checked.length) { S.dialog.error = true; return render(); }
    const m = byId(S.dialog.id); const now = new Date(); const at = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    S.reveals.push({ id: 'r' + (S.reveals.length + 1), subject: m.id, to: [...S.dialog.checked], at });
    S.status = `${m.title} revealed to ${names(S.dialog.checked)}.` + (isDone(m) ? ' Moved to Revealed.' : '');
    S.dialog = null; return render();
  }
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'wallForm') return;
  e.preventDefault();
  const text = document.getElementById('wallText').value.trim(); if (!text) return;
  const at = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const ko = document.getElementById('wallKeeperOnly');
  S.wall.unshift({ at, author: S.role === 'keeper' ? 'Keeper' : 'Harvey', text, keeperOnly: Boolean(ko && ko.checked) });
  S.status = 'Wall Entry added.'; render();
});
document.addEventListener('change', (e) => {
  const id = e.target.dataset && e.target.dataset.cb; if (!id || !S.dialog) return;
  S.dialog.checked = e.target.checked ? [...new Set([...S.dialog.checked, id])] : S.dialog.checked.filter((x) => x !== id);
  S.dialog.error = false;
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (S.dialog) { S.dialog = null; render(); } else if (S.route.panel) closePanel(); else if (S.route.drawer) go({ page: 'active', sub: 'run' });
});
reset(); render();
</script>
