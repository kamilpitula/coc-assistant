name: Set up .NET
description: Installs the SDK pinned in global.json and restores the NuGet package cache.
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
    - name: Cache NuGet packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'global.json', '.config/dotnet-tools.json') }}
        restore-keys: nuget-${{ runner.os }}-
