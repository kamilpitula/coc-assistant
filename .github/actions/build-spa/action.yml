name: Build SPA
description: Installs frontend dependencies, generates the route tree, and builds the SPA.

inputs:
  entra-client-id:
    description: Value for VITE_ENTRA_CLIENT_ID.
    required: true
  entra-authority:
    description: Value for VITE_ENTRA_AUTHORITY.
    required: true
  entra-redirect-uri:
    description: Value for VITE_ENTRA_REDIRECT_URI.
    required: true
  api-scope:
    description: Value for VITE_API_SCOPE.
    required: true
  api-base-url:
    description: Value for VITE_API_BASE_URL.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      working-directory: frontend
      shell: bash
      run: npm ci
    # routeTree.gen.ts is gitignored; the build needs it before Vite would generate it.
    - name: Generate route tree
      working-directory: frontend
      shell: bash
      run: npm run generate-routes
    - name: Build
      working-directory: frontend
      shell: bash
      run: npm run build
      env:
        VITE_ENTRA_CLIENT_ID: ${{ inputs.entra-client-id }}
        VITE_ENTRA_AUTHORITY: ${{ inputs.entra-authority }}
        VITE_API_SCOPE: ${{ inputs.api-scope }}
        VITE_ENTRA_REDIRECT_URI: ${{ inputs.entra-redirect-uri }}
        VITE_API_BASE_URL: ${{ inputs.api-base-url }}
